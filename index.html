<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi Tương Tác: Ôn Tập Giữa HK1 - KHTN 8</title>
    <style>
        :root {
            --primary-color: #1976d2;
            --primary-light: #e3f2fd;
            --secondary-color: #f57c00;
            --error-color: #d32f2f;
            --success-color: #2e7d32;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .container { background-color: var(--card-bg); width: 100%; max-width: 850px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); padding: 25px; position: relative; }
        header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--primary-light); padding-bottom: 15px; }
        h1 { color: var(--primary-color); font-size: 1.4rem; margin-bottom: 6px; }
        .sub-title { font-size: 0.95rem; color: #666; }
        
        #start-screen { text-align: center; padding: 20px 0; }
        .input-group { margin: 20px 0; }
        label { display: block; font-size: 1.1rem; margin-bottom: 10px; font-weight: 600; }
        input[type="text"] { width: 100%; max-width: 400px; padding: 12px; font-size: 1.05rem; border: 2px solid #ccc; border-radius: 8px; outline: none; text-align: center; }
        input[type="text"]:focus { border-color: var(--primary-color); }
        
        .btn { background-color: var(--primary-color); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn:hover { background-color: #0d47a1; }
        .btn-secondary { background-color: #78909c; }
        .btn-secondary:hover { background-color: #455a64; }

        .progress-container { width: 100%; background-color: #e0e0e0; border-radius: 10px; height: 10px; margin-bottom: 20px; overflow: hidden; display: none; }
        .progress-bar { height: 100%; background-color: var(--primary-color); width: 0%; transition: width 0.3s ease; }

        #quiz-screen { display: none; }
        .question-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .level-badge { background-color: var(--primary-light); color: var(--primary-color); padding: 4px 12px; border-radius: 15px; font-size: 0.85rem; font-weight: bold; }
        .question-number { font-size: 1rem; font-weight: bold; color: var(--secondary-color); }
        .question-text { font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin-bottom: 20px; }
        
        .options-list { list-style: none; }
        .option-item { background-color: #f8f9fa; border: 2px solid #e9ecef; border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; }
        .option-item:hover { border-color: var(--primary-color); background-color: var(--primary-light); }
        .option-item.selected { border-color: var(--primary-color); background-color: var(--primary-light); font-weight: bold; }
        .option-item input[type="radio"] { margin-right: 12px; transform: scale(1.2); accent-color: var(--primary-color); }

        /* Style dạng Đúng/Sai */
        .tf-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .tf-table th, .tf-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .tf-table th { background-color: var(--primary-light); color: var(--primary-color); }
        .tf-table td.center { text-align: center; width: 70px; }

        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; }
        
        #result-screen { display: none; }
        .score-box { text-align: center; background-color: var(--primary-light); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .final-score { font-size: 2.2rem; font-weight: bold; color: var(--secondary-color); margin: 8px 0; }
        
        .review-item { border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 15px; background-color: #fff; }
        .review-item.correct { border-left: 6px solid var(--success-color); }
        .review-item.incorrect { border-left: 6px solid var(--error-color); }
        .explanation { margin-top: 8px; background-color: #f1f3f4; padding: 10px; border-radius: 6px; font-size: 0.9rem; color: #444; }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            .question-text { font-size: 1rem; }
            .btn { width: 48%; padding: 10px 5px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>TRÒ CHƠI KHOA HỌC TỰ NHIÊN 8</h1>
        <div class="sub-title">Ôn Tập Giữa Học Kỳ I (Theo Đề Cương)</div>
    </header>

    <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="start-screen">
        <div class="input-group">
            <label for="student-name">Họ và tên học sinh:</label>
            <input type="text" id="student-name" placeholder="Nhập họ và tên..." autocomplete="off">
        </div>
        <button class="btn" onclick="startQuiz()">Bắt Đầu Bứt Phá</button>
    </div>

    <div id="quiz-screen">
        <div class="question-meta">
            <span class="question-number" id="q-number">Câu 1/14</span>
            <span class="level-badge" id="q-level">Ôn Tập</span>
        </div>
        <div class="question-text" id="q-text">Nội dung câu hỏi</div>
        
        <div id="interactive-area"></div>

        <div class="nav-buttons">
            <button class="btn btn-secondary" id="btn-prev" onclick="prevQuestion()" disabled>Câu trước</button>
            <button class="btn" id="btn-next" onclick="nextQuestion()">Câu tiếp</button>
            <button class="btn" id="btn-submit" onclick="submitQuiz()" style="display: none; background-color: var(--secondary-color);">Nộp Bài</button>
        </div>
    </div>

    <div id="result-screen">
        <div class="score-box">
            <h2>KẾT QUẢ BÀI LÀM</h2>
            <p style="margin-top: 5px;">Học sinh: <strong id="result-name" style="color: var(--primary-color);"></strong></p>
            <div class="final-score" id="result-score">0 / 14 Điểm</div>
            <p id="result-feedback"></p>
        </div>

        <h3 style="margin-bottom: 15px; color: var(--primary-color);">ĐÁP ÁN VÀ GIẢI THÍCH CHI TIẾT:</h3>
        <div id="review-container"></div>

        <div style="text-align: center; margin-top: 20px;">
            <button class="btn" onclick="restartQuiz()">Làm Lại Bài</button>
        </div>
    </div>
</div>

<script>
    const quizData = [
        {
            type: "single",
            level: "Kỹ Năng Thí Nghiệm",
            question: "Khi đun nóng dung dịch trong ống nghiệm trên đèn cồn, vị trí kẹp ống nghiệm đúng quy cách là ở đâu?",
            options: [
                "Ở ngay sát miệng ống nghiệm",
                "Ở chính giữa ống nghiệm",
                "Ở vị trí khoảng 1/3 ống nghiệm tính từ miệng ống",
                "Ở sát đáy ống nghiệm"
            ],
            correct: 2,
            explanation: "Thao tác đúng: Kẹp ống nghiệm ở khoảng 1/3 ống nghiệm tính từ miệng ống, làm nóng đều rồi mới đun trực tiếp tại nơi có hóa chất, hướng miệng ống về phía không có người."
        },
        {
            type: "single",
            level: "Hệ Cơ Quan",
            question: "Hệ cơ quan nào trong cơ thể người đảm nhận chức năng điều hòa hoạt động của các cơ quan thông qua việc tiết các hormone?",
            options: [
                "Hệ thần kinh",
                "Hệ nội tiết",
                "Hệ tuần hoàn",
                "Hệ bài tiết"
            ],
            correct: 1,
            explanation: "Hệ nội tiết điều hòa hoạt động các cơ quan thông qua việc tiết hormone."
        },
        {
            type: "single",
            level: "Hệ Vận Động",
            question: "Bộ xương người trưởng thành gồm khoảng bao nhiêu chiếc xương và hệ cơ gồm khoảng bao nhiêu cơ?",
            options: [
                "Khoảng 206 chiếc xương và khoảng 600 cơ",
                "Khoảng 600 chiếc xương và khoảng 206 cơ",
                "Khoảng 100 chiếc xương và khoảng 300 cơ",
                "Khoảng 206 chiếc xương và khoảng 200 cơ"
            ],
            correct: 0,
            explanation: "Bộ xương gồm khoảng 206 chiếc xương (xương đầu, xương thân, xương chi) và hệ cơ có khoảng 600 cơ (bắp cơ, dây chằng, gân)."
        },
        {
            type: "single",
            level: "Khớp Xương",
            question: "Trong các khớp động (như khớp gối, khớp háng), lớp sụn đầu xương có vai trò gì?",
            options: [
                "Bôi trơn khớp để khớp cử động trơn tru",
                "Giúp giảm ma sát và tránh cho hai đầu xương cọ xát trực tiếp vào nhau khi chuyển động",
                "Cung cấp dinh dưỡng cho tế bào xương",
                "Gắn chặt hai đầu xương lại cố định"
            ],
            correct: 1,
            explanation: "Sụn đầu xương giúp giảm ma sát và tránh hai đầu xương cọ xát trực tiếp vào nhau. Dịch khớp (chất nhờn) mới làm nhiệm vụ bôi trơn."
        },
        {
            type: "single",
            level: "Hệ Tiêu Hóa",
            question: "Dãy nào sau đây sắp xếp đúng thứ tự các cơ quan trong ống tiêu hóa ở người?",
            options: [
                "Miệng → Thực quản → Hầu → Dạ dày → Ruột già → Ruột non → Hậu môn",
                "Miệng → Hầu → Thực quản → Dạ dày → Ruột non → Ruột già → Hậu môn",
                "Miệng → Dạ dày → Hầu → Thực quản → Ruột non → Ruột già → Hậu môn",
                "Miệng → Hầu → Dạ dày → Thực quản → Ruột già → Ruột non → Hậu môn"
            ],
            correct: 1,
            explanation: "Thứ tự các cơ quan tiêu hóa: Miệng → Hầu → Thực quản → Dạ dày → Ruột non → Ruột già → Hậu môn."
        },
        {
            type: "single",
            level: "Khái Niệm Dinh Dưỡng",
            question: "Chất dinh dưỡng được định nghĩa là gì?",
            options: [
                "Là tất cả những chất lỏng mà con người uống hàng ngày để giải khát",
                "Là những chất có trong thức ăn mà cơ thể sử dụng làm nguyên liệu cấu tạo cơ thể và cung cấp năng lượng cho các hoạt động sống",
                "Là các loại thuốc bổ giúp phòng chống mọi bệnh tật",
                "Là các loại vitamin tự phát sinh trong cơ thể"
            ],
            correct: 1,
            explanation: "Chất dinh dưỡng là những chất có trong thức ăn mà cơ thể dùng làm nguyên liệu cấu tạo và cung cấp năng lượng cho hoạt động sống."
        },
        {
            type: "single",
            level: "Bệnh - Tật Cột Sống",
            question: "Đâu KHÔNG phải là nguyên nhân trực tiếp gây ra tật cong vẹo cột sống ở lứa tuổi học sinh?",
            options: [
                "Thường xuyên mang vác cặp sách quá nặng bằng một bên vai",
                "Ngồi học sai tư thế, nằm bàn hoặc cúi quá thấp",
                "Thường xuyên rèn luyện thể dục thể thao và ăn uống đủ canxi",
                "Kích thước bàn ghế học tập không phù hợp với chiều cao học sinh"
            ],
            correct: 2,
            explanation: "Luyện tập thể thao và dinh dưỡng hợp lý đầy đủ canxi giúp xương chắc khỏe, phòng chống tật cong vẹo cột sống."
        },
        {
            type: "single",
            level: "Thành Phần Của Xương",
            question: "Thành phần nào trong xương đảm nhận vai trò giúp xương có tính mềm dẻo?",
            options: [
                "Chất khoáng (chủ yếu là canxi)",
                "Chất hữu cơ",
                "Nước",
                "Khí oxy"
            ],
            correct: 1,
            explanation: "Chất hữu cơ giúp xương mềm dẻo, còn chất khoáng giúp xương bền chắc."
        },
        {
            type: "tf",
            level: "Thao Tác Lấy Hóa Chất",
            question: "Xét tính Đúng/Sai cho các thao tác khi lấy chất lỏng bằng ống hút nhỏ giọt:",
            statements: [
                "a) Bóp chặt và giữ quả bóp cao su trước khi đưa ống hút vào lọ đựng hóa chất.",
                "b) Thả nhanh quả bóp cao su để dung dịch xọc mạnh vào bên trong ống hút.",
                "c) Chuyển ống hút đến ống nghiệm và bóp nhẹ quả bóp cao su để chuyển dung dịch vào."
            ],
            correct: [true, false, true],
            explanation: "b) Sai vì cần thả CHẬM quả bóp cao su để hút dung dịch lên từ từ."
        },
        {
            type: "tf",
            level: "Chức Năng Hệ Cơ Quan",
            question: "Đánh giá tính Đúng/Sai của các khẳng định sau về chức năng các hệ cơ quan trong cơ thể:",
            statements: [
                "a) Hệ bài tiết có chức năng lọc máu hình thành nước tiểu và thải ra môi trường.",
                "b) Hệ tuần hoàn giúp trao đổi khí oxygen và carbon dioxide với môi trường.",
                "c) Hệ thần kinh có vai trò điều khiển, điều hòa hoạt động của các cơ quan trong cơ thể."
            ],
            correct: [true, false, true],
            explanation: "b) Sai vì Hệ HÔ HẤP mới có chức năng trao đổi khí, còn Hệ TUẦN HOÀN vận chuyển các chất đến tế bào và chất thải đến cơ quan bài tiết."
        },
        {
            type: "tf",
            level: "Cấu Tạo Hệ Vận Động",
            question: "Đánh giá tính Đúng/Sai về các bộ phận thuộc hệ vận động ở người:",
            statements: [
                "a) Xương đầu gồm có xương Sọ và xương Mặt.",
                "b) Xương thân gồm có cột sống, xương sườn và xương Chi (tay, chân).",
                "c) Hệ cơ bám vào xương nhờ các mô liên kết như dây chằng và gân."
            ],
            correct: [true, false, true],
            explanation: "b) Sai vì Xương thân gồm cột sống, xương sườn, xương ỨC (còn Tay, Chân thuộc nhóm xương Chi)."
        },
        {
            type: "tf",
            level: "Đặc Điểm Xương Người Già",
            question: "Xét tính Đúng/Sai về đặc điểm cấu trúc xương ở người cao tuổi:",
            statements: [
                "a) Ở người già, tỉ lệ chất hữu cơ giảm xuống và tỉ lệ chất khoáng tăng lên so với người trẻ.",
                "b) Sự giảm thành phần chất hữu cơ làm cho xương người già bị giòn và rất dễ gãy.",
                "c) Khi bị gãy xương, xương của người già phục hồi rất nhanh chóng do tế bào xương phân chia mạnh."
            ],
            correct: [true, true, false],
            explanation: "c) Sai vì xương người già rất CHẬM phục hồi do tế bào xương ít phân chia và khả năng tái tạo kém."
        },
        {
            type: "tf",
            level: "Phòng Bệnh Hệ Vận Động",
            question: "Đánh giá tính Đúng/Sai cho các biện pháp bảo vệ và chăm sóc hệ vận động:",
            statements: [
                "a) Nên gánh vác hoặc đeo cặp sách nặng bằng một bên vai để rèn luyện cơ bắp lệch.",
                "b) Luyện tập thể dục, thể thao giúp bảo vệ hệ vận động, làm cơ bắp nở nang và rắn chắc.",
                "c) Ngồi học ngay ngắn, thẳng lưng, không gù hay lệch vai giúp phòng chống tật cong vẹo cột sống."
            ],
            correct: [false, true, true],
            explanation: "a) Sai vì mang vác quá nặng hoặc đeo cặp một bên vai là nguyên nhân chính gây cong vẹo cột sống."
        },
        {
            type: "tf",
            level: "Tính Thống Nhất Cơ Thể",
            question: "Xét tính Đúng/Sai về mối quan hệ giữa các hệ cơ quan trong cơ thể người:",
            statements: [
                "a) Các hệ cơ quan trong cơ thể người hoạt động riêng rẽ, không liên quan gì đến nhau.",
                "b) Trong cơ thể người, các hệ cơ quan có mối quan hệ qua lại, phối hợp hoạt động chặt chẽ với nhau để tạo thành một thể thống nhất."
            ],
            correct: [false, true],
            explanation: "b) Đúng vì các hệ cơ quan luôn phối hợp hoạt động chặt chẽ để tạo thành thể thống nhất."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let studentName = "";

    function startQuiz() {
        const name = document.getElementById('student-name').value.trim();
        if (!name) { alert("Vui lòng nhập họ và tên của em!"); return; }
        studentName = name;
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('progress-container').style.display = 'block';
        loadQuestion();
    }

    function loadQuestion() {
        const q = quizData[currentQuestion];
        document.getElementById('q-number').innerText = `Câu ${currentQuestion + 1}/${quizData.length}`;
        document.getElementById('q-level').innerText = q.level;
        document.getElementById('q-text').innerText = q.question;

        document.getElementById('progress-bar').style.width = `${((currentQuestion + 1) / quizData.length) * 100}%`;

        const area = document.getElementById('interactive-area');
        area.innerHTML = '';

        if (q.type === 'single') {
            const ul = document.createElement('ul');
            ul.className = 'options-list';
            q.options.forEach((opt, idx) => {
                const li = document.createElement('li');
                li.className = `option-item ${userAnswers[currentQuestion] === idx ? 'selected' : ''}`;
                li.onclick = () => { userAnswers[currentQuestion] = idx; loadQuestion(); };
                li.innerHTML = `<input type="radio" ${userAnswers[currentQuestion] === idx ? 'checked' : ''}> ${opt}`;
                ul.appendChild(li);
            });
            area.appendChild(ul);
        } else if (q.type === 'tf') {
            if (!userAnswers[currentQuestion]) userAnswers[currentQuestion] = new Array(q.statements.length).fill(null);
            const table = document.createElement('table');
            table.className = 'tf-table';
            table.innerHTML = `<tr><th>Mệnh đề</th><th class="center">Đúng</th><th class="center">Sai</th></tr>`;
            q.statements.forEach((stmt, idx) => {
                const tr = document.createElement('tr');
                const val = userAnswers[currentQuestion][idx];
                tr.innerHTML = `
                    <td>${stmt}</td>
                    <td class="center"><input type="radio" name="tf-${idx}" ${val === true ? 'checked' : ''} onclick="setTF(${idx}, true)"></td>
                    <td class="center"><input type="radio" name="tf-${idx}" ${val === false ? 'checked' : ''} onclick="setTF(${idx}, false)"></td>
                `;
                table.appendChild(tr);
            });
            area.appendChild(table);
        }

        document.getElementById('btn-prev').disabled = currentQuestion === 0;
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('btn-next').style.display = 'none';
            document.getElementById('btn-submit').style.display = 'inline-block';
        } else {
            document.getElementById('btn-next').style.display = 'inline-block';
            document.getElementById('btn-submit').style.display = 'none';
        }
    }

    function setTF(idx, val) { userAnswers[currentQuestion][idx] = val; }
    function nextQuestion() { if (currentQuestion < quizData.length - 1) { currentQuestion++; loadQuestion(); } }
    function prevQuestion() { if (currentQuestion > 0) { currentQuestion--; loadQuestion(); } }

    function submitQuiz() {
        let score = 0;
        quizData.forEach((q, idx) => {
            const ans = userAnswers[idx];
            if (q.type === 'single' && ans === q.correct) score++;
            else if (q.type === 'tf' && Array.isArray(ans) && ans.every((v, i) => v === q.correct[i])) score++;
        });

        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('progress-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        document.getElementById('result-name').innerText = studentName;
        document.getElementById('result-score').innerText = `${score} / 14 Điểm`;

        const feedback = document.getElementById('result-feedback');
        if (score === 14) {
            feedback.innerText = "Xuất sắc! Em đã nắm vững 100% nội dung đề cương ôn tập KHTN 8!";
            feedback.style.color = "var(--success-color)";
        } else if (score >= 10) {
            feedback.innerText = "Kết quả rất tốt! Hãy xem lại các câu sai để chuẩn bị cho kì thi đạt điểm tối đa nhé!";
            feedback.style.color = "var(--primary-color)";
        } else {
            feedback.innerText = "Em nên đọc lại đề cương và làm lại bài thử thách này để ghi nhớ kiến thức kĩ hơn!";
            feedback.style.color = "var(--error-color)";
        }

        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = '';
        quizData.forEach((q, idx) => {
            const item = document.createElement('div');
            item.className = 'review-item';
            item.innerHTML = `<strong>Câu ${idx + 1}: ${q.question}</strong><div class="explanation"><strong>Lời giải / Giải thích:</strong> ${q.explanation}</div>`;
            reviewContainer.appendChild(item);
        });
    }

    function restartQuiz() {
        currentQuestion = 0;
        userAnswers = new Array(quizData.length).fill(null);
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'block';
    }
</script>
</body>
</html>
